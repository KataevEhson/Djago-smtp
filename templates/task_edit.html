{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Изменить задачу · Taskly</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <header>
            <div class="nav">
                <a class="brand" href="{% url 'profile' %}">Taskly.</a>
                <div class="account">{{ request.user.username }}</div>
            </div>
        </header>
        <main>
            <div class="form-card">
                <a class="back" href="{% url 'profile' %}">Назад</a>
                <h1>Изменить задачу</h1>
                <div class="card">
                    <form method="post">
                        {% csrf_token %}
                        <p>
                            <input type="text" name="title" placeholder="Название" value="{{ task.title }}" maxlength="150" required aria-label="Название">
                        </p>
                        <p>
                            <textarea name="description" rows="4" placeholder="Описание" aria-label="Описание">{{ task.description }}</textarea>
                        </p>
                        <p>
                            <input type="checkbox" name="completed" {{ task.completed|yesno:"checked," }} aria-label="Выполнено">
                            Выполнено
                        </p>
                        <div class="buttons">
                            <button class="btn" type="submit">Сохранить</button>
                            <a class="btn secondary" href="{% url 'profile' %}">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
