{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Мои задачи · Taskly</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <header>
            <div class="nav">
                <a class="brand" href="{% url 'profile' %}">Taskly.</a>
                <div class="account">{{ request.user.username }}</div>
            </div>
        </header>
        <main>
            <div class="heading">
                <div>

                    <h1>Мои задачи</h1>
                </div>
                <a class="btn" href="{% url 'task_create' %}">＋ Новая задача</a>
            </div>
            <p>
                <a class="btn secondary" href="{% url 'send_message_all' %}">Рассылка</a>
            </p>
            <div class="list">
                {% for task in tasks %}
                    <article class="card task {{ task.completed|yesno:"finished," }}">
                        <div class="marker" aria-hidden="true">{{ task.completed|yesno:"✓,○" }}</div>
                        <div class="task-body">
                            <h2>
                                <a href="{% url 'task_detail' task.pk %}">{{ task.title }}</a>
                            </h2>
                            <p class="description">{{ task.description }}</p>
                            <div class="tag">{{ task.completed|yesno:"Выполнено,В работе" }}</div>
                        </div>
                        <div class="actions">
                            <a class="btn" href="{% url 'task_detail' task.pk %}">Открыть</a>
                        </div>
                    </article>
                {% endfor %}
            </div>
        </main>
    </body>
</html>
