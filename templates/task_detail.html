{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Просмотр задачи · Taskly</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <header>
            <div class="nav">
                <a class="brand" href="{% url 'profile' %}">Taskly.</a>
                <div class="account">{{ request.user.username }}</div>
            </div>
        </header>
        <main>
            <div class="form-card">
                <a class="back" href="{% url 'profile' %}">Назад</a>
                <article class="card">

                    <h1 class="long-title">{{ task.title }}</h1>
                    <div class="tag">{{ task.completed|yesno:"Выполнено,В работе" }}</div>
                    <p class="description">{{ task.description|default:'Нет описания' }}</p>
                    <div class="muted">Создана {{ task.created_at|date:'d.m.Y H:i' }}</div>
                    <div class="buttons">
                        <a class="btn" href="{% url 'task_update' task.pk %}">Изменить</a>
                        <a class="btn secondary" href="{% url 'task_delete' task.pk %}">Удалить</a>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>
