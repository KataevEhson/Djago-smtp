{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая задача</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <main class="form-card">
        <h1>Новая задача</h1>

        <form class="card" method="post">
            {% csrf_token %}

            <p>
                <input type="text" name="title" placeholder="Название" maxlength="150" required>
            </p>

            <p>
                <textarea name="description" placeholder="Описание" rows="4"></textarea>
            </p>

            <p>
                <input type="checkbox" name="completed"> Выполнено
            </p>

            <button class="btn" type="submit">Сохранить</button>
            <a class="btn secondary" href="{% url 'profile' %}">Назад</a>
        </form>
    </main>
</body>
</html>
