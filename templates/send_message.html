{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рассылка · Taskly</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <div class="nav">
            <a class="brand" href="{% url 'profile' %}">Taskly.</a>
            <div class="account">{{ request.user.username }}</div>
        </div>
    </header>
    <main>
        <div class="form-card">
            <a class="back" href="{% url 'profile' %}">Назад</a>
            <div class="card">
                <h1>Рассылка</h1>
                <p class="muted">Письмо всем пользователям.</p>
                <p>Привет! На сайте появились новости.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="buttons">
                        <button class="btn" type="submit">Отправить всем</button>
                        <a class="btn secondary" href="{% url 'profile' %}">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
